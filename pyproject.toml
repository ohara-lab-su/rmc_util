[build-system]
requires = ["setuptools>=71.0", "coloredlogs"]
build-backend = "setuptools.build_meta"

[project]
name = "rmc-util"
version = "0.1.8"

description = "Python toolkit for RMC_POT input preparation, calculation automation, and result analysis."
authors = [
    { name = "Kengo NAKADA", email = "kengo.nakada@email.com" },
    { name = "Kentaro Kobayashi", email = "kobayashi@mat.shimane-u.ac.jp" }
]
readme = "README.md"

# requires-python = ">=3.8"
requires-python = ">=3.10"
dependencies = [
    # my-modules
    #"x_logger",
    "xlogger-py",
    "packmol-util",
    # fnc
    "pymatgen",
    # basic
    "dataclasses",
    "coloredlogs",
    "colorlog",
    "pytest",
    "pytest-asyncio",
    "pyyaml",
    "toml",
    # "grpcio",
    "nest_asyncio",
    # pages
    "sphinx",
    "myst-parser",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
    "sphinxcontrib-napoleon",
    "linkify-it-py"
]

[project.urls]
Homepage = "https://ohara-lab-su.github.io/rmc_util/en/"
Documentation = "https://ohara-lab-su.github.io/rmc_util/en/"
Repository = "https://github.com/ohara-lab-su/rmc_util"
Issues = "https://github.com/ohara-lab-su/rmc_util/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]

# ここでpytestのiniと同じようにオプションが書ける
# 例えばテストマーク、フィルタ、カバレッジなども追記可能

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[project.scripts]
rmc_util = "rmc_util.install:main"

[tool.setuptools.data-files]
"share/rmc_util/scripts" = [
    "scripts/rmc.py",
    "scripts/rmc_init.py",
]
